name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create draft release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create release
        id: create
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/vishal-1908/pay-and-pray/blob/main/CHANGELOG.md) for the human-written release notes.

            **Downloads:**
            - macOS (Apple Silicon): `Pay.and.Pray_*_aarch64.dmg`
            - Windows: `Pay.and.Pray_*_x64_en-US.msi`
            - Linux AppImage: `Pay.and.Pray_*_amd64.AppImage`
            - Linux Debian: `pay-and-pray_*_amd64.deb`

  build:
    name: Build ${{ matrix.platform.name }}
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: macos-arm, os: macos-latest, target: aarch64-apple-darwin }
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform.target }}

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            patchelf

      - run: npm ci

      - name: Build and upload
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public OAuth App client id for Copilot device-flow sign-in
          # (compiled in via option_env!). Set as a repo variable.
          PAY_AND_PRAY_GITHUB_CLIENT_ID: ${{ vars.PAY_AND_PRAY_GITHUB_CLIENT_ID }}
          # Updater signing — required for tauri-plugin-updater to accept the
          # downloaded artifact. Generate with `tauri signer generate`; the
          # public key lives in tauri.conf.json (plugins.updater.pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Add the following for signed macOS builds (Phase 5):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.platform.target }}

  updater-manifest:
    name: Assemble latest.json
    # The build matrix runs one job per OS, and each emits its own `latest.json`
    # that overwrites the others on upload — so the published manifest would only
    # ever describe the last platform to finish. Rebuild a single merged manifest
    # from the signed artifacts once every platform is done. macOS is omitted on
    # purpose (notarized signing deferred — that build falls back to the browser).
    permissions:
      contents: write
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Build and upload latest.json
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const releaseId = ${{ needs.create-release.outputs.release_id }};
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');

            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });
            const byName = new Map(assets.map((a) => [a.name, a]));

            // Map an updater artifact filename to its latest.json platform key.
            function platformKey(name) {
              if (/\.msi$/i.test(name) || /\.exe$/i.test(name)) return 'windows-x86_64';
              if (/\.AppImage$/i.test(name)) return 'linux-x86_64';
              return null; // .app.tar.gz (macOS), .deb, etc. — no self-update
            }

            const platforms = {};
            for (const asset of assets) {
              if (!asset.name.endsWith('.sig')) continue;
              const base = byName.get(asset.name.slice(0, -4));
              if (!base) continue;
              const key = platformKey(base.name);
              if (!key) continue;

              const sig = await github.rest.repos.getReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
                headers: { accept: 'application/octet-stream' },
              });
              // Build the URL from the tag, NOT `base.browser_download_url`:
              // at this point the release is still a draft, so the API returns a
              // `…/download/untagged-<hash>/…` URL that 404s once published.
              platforms[key] = {
                signature: Buffer.from(sig.data).toString('utf8').trim(),
                url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}/${encodeURIComponent(base.name)}`,
              };
            }

            if (Object.keys(platforms).length === 0) {
              throw new Error('No updater artifacts (.sig) found — cannot build latest.json');
            }

            const manifest = {
              version,
              notes: `See https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`,
              pub_date: new Date().toISOString(),
              platforms,
            };

            // Replace the per-platform latest.json files left by the matrix jobs.
            const existing = assets.find((a) => a.name === 'latest.json');
            if (existing) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existing.id,
              });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: 'latest.json',
              data: JSON.stringify(manifest, null, 2),
            });
            core.info(`latest.json written for: ${Object.keys(platforms).join(', ')}`);

  publish:
    name: Publish release
    # Needs `create-release` too, otherwise `needs.create-release.outputs.release_id`
    # renders as empty in the script body and the github-script step crashes with
    # `SyntaxError: Unexpected token ','` (seen on the v1.0.0 tag).
    permissions:
      contents: write
    needs: [create-release, build, updater-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            })
